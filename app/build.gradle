apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk 34

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    defaultConfig {
        applicationId "com.happyplaces"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { jvmToolchain(17) }

    namespace 'com.happyplaces'
}

ext {
    coroutines_version  = '1.8.1'
    lifecycle_version   = '2.8.7'
    room_version        = '2.6.1'
    material_version    = '1.12.0'
    core_version        = '1.10.0'
    appcompat_version   = '1.7.0'
    constraint_version  = '2.2.1'
    retrofit_version    = '2.11.0'
    okhttp_version      = '4.12.0'
    hilt_version        = '2.51.1'
    maps_version        = '19.0.0'
    places_version      = '4.1.0'
    mockk_version       = '1.14.0'
    truth_version       = '1.4.2'
    robo_version        = '4.15.1'
}

dependencies {
    /* ───── 基本 AndroidX / Material ───── */
    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraint_version"
    implementation "com.google.android.material:material:$material_version"

    /* ───── Lifecycle & Room ───── */
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp           "androidx.room:room-compiler:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"

    /* ───── 協程 ───── */
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    /* ───── Retrofit + OkHttp BOM ───── */
    implementation platform("com.squareup.okhttp3:okhttp-bom:$okhttp_version")
    implementation "com.squareup.okhttp3:okhttp"
    implementation "com.squareup.okhttp3:logging-interceptor"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    /* ───── Hilt ───── */
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp           "com.google.dagger:hilt-android-compiler:$hilt_version"

    /* ───── Google Maps / Places ───── */
    implementation "com.google.android.gms:play-services-maps:$maps_version"
    implementation "com.google.android.libraries.places:places:$places_version"

    /* ───── 其他 UI/權限工具 ───── */
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.karumi:dexter:6.2.3'

    /* ───── 單元測試 ───── */
    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:$mockk_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "androidx.test:core:1.4.0"
    testImplementation "androidx.test:core-ktx:1.4.0"
    testImplementation "androidx.lifecycle:lifecycle-runtime-testing:$lifecycle_version"
    testImplementation "com.google.truth:truth:$truth_version"
    testImplementation "org.robolectric:robolectric:4.14.1"

    /* ───── 儀器測試 ───── */
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
